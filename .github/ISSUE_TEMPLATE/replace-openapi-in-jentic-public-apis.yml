name: Replace OpenAPI in Jentic Public APIs
description: Completely delete an existing API folder and re-import it fresh from a new OpenAPI URL.
title: "[AUTO] Replace OpenAPI in Jentic Public APIs: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ DESTRUCTIVE OPERATION — READ FIRST

        This is **NOT** an update or a merge. Use this only when re-publishing the **same** `vendor/api` with a brand-new spec and you want the whole prior folder discarded.

        When this issue is opened, the workflow will:
        1. **COMPLETELY DELETE** `apis/openapi/<vendor>/<api_name>/` — every version directory and the api-level meta.json. If that api was the only one under the vendor, the empty vendor folder is deleted too.
        2. Re-run the import pipeline against the new URL, regenerating the entire folder from scratch.
        3. Open a PR against `main` for review before it merges.

        If you only want to **add** a new version alongside existing ones, use **Import OpenAPI to Jentic Public APIs** instead — this template throws the old folder away.

        **Leave the `replace_oas_url:` / `vendor_name:` prefixes intact** — the workflow reads those exact keys. Type your value after the prefix on the same line.

  - type: textarea
    id: replace_oas_url
    attributes:
      label: New OpenAPI Specification URL
      description: |
        A URL that returns the raw NEW OpenAPI document (.json or .yaml) directly — the response body must be the spec itself, not an HTML page. The host does not need to be GitHub; any directly-served spec works.
        ✅ https://raw.githubusercontent.com/.../openapi.json  (GitHub raw)
        ✅ https://api.example.com/openapi.json  (spec served from the API's own domain)
        ✅ https://api.example.com/v3/api-docs  (Swagger/OpenAPI endpoint, JSON body)
        ✅ https://example.com/specs/petstore.yaml  (raw YAML on any host)
        ❌ https://github.com/.../blob/.../openapi.json  (GitHub web UI page, returns HTML)
        ❌ https://example.com/api-docs  (Swagger UI viewer page, returns HTML)
      value: "replace_oas_url: "
      render: text
    validations:
      required: true

  - type: textarea
    id: vendor_name
    attributes:
      label: Vendor / API Name (fully qualified)
      description: |
        The `<vendor>/<api_name>` of the folder to REPLACE. The `/<api_name>` segment is **MANDATORY** — replace never defaults to `main`.
        - `hashicorp.com/nomad` → deletes apis/openapi/hashicorp.com/nomad/, then re-imports
        - `stripe.com/payments` → deletes apis/openapi/stripe.com/payments/, then re-imports
        - ❌ `hashicorp.com` (missing `/<api_name>` — rejected)
        ⚠️ Double-check this: an incorrect value deletes the wrong folder (reviewable in the PR before merge).
      value: "vendor_name: "
      render: text
    validations:
      required: true

  - type: textarea
    id: confirm_replacement
    attributes:
      label: Confirm Replacement
      description: Confirm you understand the existing folder (all versions, meta, and scoring) will be deleted and regenerated.
      placeholder: e.g. Confirmed — replacing the old spec with vX.Y.
    validations:
      required: false

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: Optional — any extra context about this replacement that might be helpful.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <details>
        <summary>Advanced (optional): validation overrides</summary>

        Both default to `true`. To relax them, edit the value after the prefix (keep the prefix and the line format).
        </details>

  - type: textarea
    id: reject_invalid_server_urls
    attributes:
      label: Reject invalid server URLs (optional)
      description: "Set to `false` to allow specs with non-http(s) or placeholder server URLs. Defaults to true."
      value: "reject_invalid_server_urls: true"
      render: text
    validations:
      required: false

  - type: textarea
    id: reject_invalid_security
    attributes:
      label: Reject invalid security definitions (optional)
      description: "Set to `false` to allow specs with security-definition issues. Defaults to true."
      value: "reject_invalid_security: true"
      render: text
    validations:
      required: false
