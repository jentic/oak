name: Generate Arazzo Specification for Jentic OpenAPI
description: Request automatic generation of an Arazzo specification from a Jentic OpenAPI URL.
title: "[AUTO] Generate Arazzo spec for Jentic OpenAPI"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### OpenAPI Specification URL

        A GitHub **raw** URL to an OpenAPI spec already in this repository, returning the raw JSON directly (not an HTML page).

        ⚠️ Unlike import/replace, this **must** be a raw URL into this repo — the generator derives the vendor, api, and version from the `apis/openapi/<vendor>/<api>/<version>/openapi.json` path, so the URL must contain that path.

        **Valid:**
        - `https://raw.githubusercontent.com/jentic/jentic-public-apis/refs/heads/main/apis/openapi/vendor.com/api/version/openapi.json`

        **Not valid:**
        - `https://github.com/jentic/jentic-public-apis/blob/main/apis/openapi/vendor.com/api/version/openapi.json` — web UI page, returns HTML
        - `https://api.vendor.com/openapi.json` — not a Jentic-repo path, vendor/api/version can't be derived

  - type: textarea
    id: openapi_url
    attributes:
      label: OpenAPI Specification URL (Jentic repo raw URL)
      description: Keep the `openapi_url:` prefix; type the raw URL after it on the same line.
      value: "openapi_url: "
      render: text
    validations:
      required: true

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: Optional — any extra context about this API that might be helpful.
    validations:
      required: false

  - type: textarea
    id: workflow_descriptions
    attributes:
      label: Workflow Descriptions (optional)
      description: |
        Optional — request specific workflows, one per line. If left blank, the generator discovers workflows automatically.
      value: |
        -
      placeholder: |
        - Create a new user and assign them a role
        - Authenticate a user and fetch their profile
        - Submit an order and retrieve order status
    validations:
      required: false
