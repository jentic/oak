name: Generate Arazzo Specification for Jentic OpenAPI
description: Request automatic generation of an Arazzo specification from a Jentic OpenAPI URL.
title: "[AUTO] Generate Arazzo spec for Jentic OpenAPI"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Provide the RAW URL to an OpenAPI spec already in the Jentic Public API repository. **Leave the `openapi_url:` prefix intact** — the generator reads that exact key. Type your value after the prefix on the same line.

  - type: textarea
    id: openapi_url
    attributes:
      label: OpenAPI Specification URL (raw)
      description: |
        The RAW URL to the OpenAPI spec in the Jentic Public API repo. Must point directly at the JSON file, not a GitHub web page.
        ✅ https://raw.githubusercontent.com/jentic/jentic-public-apis/refs/heads/main/apis/openapi/vendor.com/api/version/openapi.json
        ❌ https://github.com/jentic/jentic-public-apis/blob/main/apis/openapi/vendor.com/api/version/openapi.json
      value: "openapi_url: "
      render: text
    validations:
      required: true

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: Optional — any extra context about this API that might be helpful.
    validations:
      required: false

  - type: textarea
    id: workflow_descriptions
    attributes:
      label: Workflow Descriptions (optional)
      description: |
        Optional — request specific workflows, one per line. If left blank, the generator discovers workflows automatically.
      value: |
        -
      placeholder: |
        - Create a new user and assign them a role
        - Authenticate a user and fetch their profile
        - Submit an order and retrieve order status
    validations:
      required: false
