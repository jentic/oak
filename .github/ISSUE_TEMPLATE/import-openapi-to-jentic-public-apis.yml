name: Import OpenAPI to Jentic Public APIs
description: Request import of an OpenAPI spec to Jentic Public APIs from an OpenAPI URL.
title: "[AUTO] Import OpenAPI to Jentic Public APIs: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the fields below. **Leave the `import_oas_url:` / `vendor_name:` prefixes intact** — the import workflow reads those exact keys. Just type your value after the prefix on the same line.

  - type: markdown
    attributes:
      value: |
        ### OpenAPI Specification URL

        A URL that returns the raw OpenAPI document (`.json` or `.yaml`) **directly** — the response body must be the spec itself, not an HTML page. The host need not be GitHub; any directly-served spec works.

        **Valid:**
        - `https://raw.githubusercontent.com/.../openapi.json` — GitHub raw
        - `https://api.example.com/openapi.json` — spec served from the API's own domain
        - `https://api.example.com/v3/api-docs` — Swagger/OpenAPI endpoint (JSON body)
        - `https://example.com/specs/petstore.yaml` — raw YAML on any host

        **Not valid (return HTML, not the spec):**
        - `https://github.com/.../blob/.../openapi.json` — GitHub web UI page
        - `https://example.com/api-docs` — Swagger UI viewer page

  - type: textarea
    id: import_oas_url
    attributes:
      label: OpenAPI Specification URL
      description: Keep the `import_oas_url:` prefix; type the URL after it on the same line.
      value: "import_oas_url: "
      render: text
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Vendor Name

        Vendor name (e.g. `github.com`, `stripe.com`). Parsed into vendor + api_name:
        - `hashicorp.com` → vendor=hashicorp.com, api_name=main
        - `hashicorp.com/nomad` → vendor=hashicorp.com, api_name=nomad

  - type: textarea
    id: vendor_name
    attributes:
      label: Vendor Name
      description: Keep the `vendor_name:` prefix; type the vendor after it on the same line.
      value: "vendor_name: "
      render: text
    validations:
      required: true

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: Optional — any extra context about this API that might be helpful.
      placeholder: e.g. free tier limits, auth notes, number of endpoints.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <details>
        <summary>Advanced (optional): validation overrides</summary>

        Both default to `true`. To relax them, edit the value after the prefix (keep the prefix and the line format). Leave blank/remove the block to use defaults.
        </details>

  - type: textarea
    id: reject_invalid_server_urls
    attributes:
      label: Reject invalid server URLs (optional)
      description: "Set to `false` to allow specs with non-http(s) or placeholder server URLs. Defaults to true."
      value: "reject_invalid_server_urls: true"
      render: text
    validations:
      required: false

  - type: textarea
    id: reject_invalid_security
    attributes:
      label: Reject invalid security definitions (optional)
      description: "Set to `false` to allow specs with security-definition issues. Defaults to true."
      value: "reject_invalid_security: true"
      render: text
    validations:
      required: false
