name: Import OpenAPI to Jentic Public APIs
description: Request import of an OpenAPI spec to Jentic Public APIs from an OpenAPI URL.
title: "[AUTO] Import OpenAPI to Jentic Public APIs: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the fields below. **Leave the `import_oas_url:` / `vendor_name:` prefixes intact** — the import workflow reads those exact keys. Just type your value after the prefix on the same line.

  - type: textarea
    id: import_oas_url
    attributes:
      label: OpenAPI Specification URL (raw)
      description: |
        The RAW URL to the OpenAPI spec (.json or .yaml). Must point directly at the file, not a GitHub web page.
        ✅ https://raw.githubusercontent.com/.../openapi.json
        ❌ https://github.com/.../blob/.../openapi.json
      value: "import_oas_url: "
      render: text
    validations:
      required: true

  - type: textarea
    id: vendor_name
    attributes:
      label: Vendor Name
      description: |
        Vendor name (e.g. github.com, stripe.com). Parsed into vendor + api_name.
        - `hashicorp.com` → vendor=hashicorp.com, api_name=main
        - `hashicorp.com/nomad` → vendor=hashicorp.com, api_name=nomad
      value: "vendor_name: "
      render: text
    validations:
      required: true

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: Optional — any extra context about this API that might be helpful.
      placeholder: e.g. free tier limits, auth notes, number of endpoints.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <details>
        <summary>Advanced (optional): validation overrides</summary>

        Both default to `true`. To relax them, edit the value after the prefix (keep the prefix and the line format). Leave blank/remove the block to use defaults.
        </details>

  - type: textarea
    id: reject_invalid_server_urls
    attributes:
      label: Reject invalid server URLs (optional)
      description: "Set to `false` to allow specs with non-http(s) or placeholder server URLs. Defaults to true."
      value: "reject_invalid_server_urls: true"
      render: text
    validations:
      required: false

  - type: textarea
    id: reject_invalid_security
    attributes:
      label: Reject invalid security definitions (optional)
      description: "Set to `false` to allow specs with security-definition issues. Defaults to true."
      value: "reject_invalid_security: true"
      render: text
    validations:
      required: false
