name: Import OpenAPI to Jentic Public APIs
description: Request import of an OpenAPI spec to Jentic Public APIs from an OpenAPI URL.
title: "[AUTO] Import OpenAPI to Jentic Public APIs: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the fields below. **Leave the `import_oas_url:` / `vendor_name:` prefixes intact** — the import workflow reads those exact keys. Just type your value after the prefix on the same line.

  - type: textarea
    id: import_oas_url
    attributes:
      label: OpenAPI Specification URL
      description: |
        A URL that returns the raw OpenAPI document (.json or .yaml) directly — the response body must be the spec itself, not an HTML page. The host does not need to be GitHub; any directly-served spec works.
        ✅ https://raw.githubusercontent.com/.../openapi.json  (GitHub raw)
        ✅ https://api.example.com/openapi.json  (spec served from the API's own domain)
        ✅ https://api.example.com/v3/api-docs  (Swagger/OpenAPI endpoint, JSON body)
        ✅ https://example.com/specs/petstore.yaml  (raw YAML on any host)
        ❌ https://github.com/.../blob/.../openapi.json  (GitHub web UI page, returns HTML)
        ❌ https://example.com/api-docs  (Swagger UI viewer page, returns HTML)
      value: "import_oas_url: "
      render: text
    validations:
      required: true

  - type: textarea
    id: vendor_name
    attributes:
      label: Vendor Name
      description: |
        Vendor name (e.g. github.com, stripe.com). Parsed into vendor + api_name.
        - `hashicorp.com` → vendor=hashicorp.com, api_name=main
        - `hashicorp.com/nomad` → vendor=hashicorp.com, api_name=nomad
      value: "vendor_name: "
      render: text
    validations:
      required: true

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: Optional — any extra context about this API that might be helpful.
      placeholder: e.g. free tier limits, auth notes, number of endpoints.
    validations:
      required: false
